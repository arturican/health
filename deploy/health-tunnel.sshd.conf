# Append to the END of the data VPS sshd_config; validate before reload.
Match User health-tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:3101
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    PermitTunnel no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /bin/false
