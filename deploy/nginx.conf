server {
    listen 80;
    listen [::]:80;
    server_name dev.arturican.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://dev.arturican.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.arturican.com;
    ssl_certificate /etc/letsencrypt/live/dev.arturican.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.arturican.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/health/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /api/ {
        gzip off;
        proxy_pass http://127.0.0.1:53101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace untrusted client values; never append an incoming chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 200m;
        client_body_timeout 130s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        access_log off;
        error_log /dev/null crit;
    }
    location /assets/ {
        gzip on;
        gzip_types application/javascript text/javascript text/css image/svg+xml font/ttf application/octet-stream;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        root /var/www/health;
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
