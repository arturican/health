server {
    listen 80;
    listen [::]:80;
    server_name dev.arturican.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://dev.arturican.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.arturican.com;
    ssl_certificate /etc/letsencrypt/live/dev.arturican.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.arturican.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/health/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ {
        root /var/www/health;
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
