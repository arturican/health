name: Application checks

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run lint
      - run: npm run typecheck

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: health_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d health_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/health_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.dist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Verify monitor units
        run: systemd-analyze verify deploy/health-backup-monitor.service deploy/health-backup-monitor.timer deploy/health-watchdog.service deploy/health-watchdog.timer deploy/health-offsite-monitor.service deploy/health-offsite-monitor.timer
      - name: Verify production archive with restricted receiver
        run: python3 -B deploy/verify_build.py dist
      - name: Save production build for tests
        id: dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: health-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:run
      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            src/**/__screenshots__/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: health_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d health_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/health_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      # Each matrix job owns its API, clock, backup slot and PostgreSQL service.
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-failures-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing required status; a skipped/cancelled gate must not pass.
  check:
    if: ${{ always() }}
    needs: [static, coverage, build, browser, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every quality gate
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$E2E_RESULT" = success

  deploy:
    needs: [check, build]
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: health-dev
      url: https://dev.arturican.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/
      - name: Publish tested build over restricted SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HEALTH_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HEALTH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.HEALTH_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/health-key"
          hosts_path="$RUNNER_TEMP/health-known-hosts"
          trap 'rm -f "$key_path" "$hosts_path"' EXIT
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          printf '%s\n' "$DEPLOY_KEY" > "$key_path"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_path"
          tar -czf "$RUNNER_TEMP/health-dist.tar.gz" -C dist .
          ssh -i "$key_path" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$hosts_path" \
            "health-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/health-dist.tar.gz"
      - name: Verify published revision over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          revision=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --retry 3 https://dev.arturican.com/release.txt)
          test "$revision" = "$GITHUB_SHA"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            https://dev.arturican.com/ --output /dev/null
